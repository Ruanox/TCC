<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro Escolar</title>
    <!-- Importação do bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static',filename='/css/style.css')}}"
    />
  </head>

  <body>
    <header class="site-header">
      <img
        src="{{ url_for('static', filename='images/sportcorp_logo_transparente.png') }}"
        alt="SportCorp Logo"
        class="header-logo"
      />
    </header>

    <!-- Aqui vai a NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark header-nav">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Tela de Cadastro</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{url_for('escolas')}}">Escolas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{url_for('professores')}}">Professores</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{url_for('alunos')}}">Alunos</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    {% block content %}
    <!-- Aqui irá conteúdo principal do site -->
    {% endblock content %}
  </body>
</html>
