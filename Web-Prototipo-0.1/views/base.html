<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SportCorp: aplicativo desktop e mobile para gestão esportiva, acompanhamento de atletas e organização de treinos." />
    <title>SportCorp | App Desktop e Mobile</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>

  <body>
    <header class="site-header">
      <a href="{{ url_for('home') }}">
        <img
          src="{{ url_for('static', filename='images/sportcorp_logo_transparente.png') }}"
          alt="SportCorp Logo"
          class="header-logo"
        />
      </a>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark header-nav">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('home') }}">SportCorp</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('home') }}">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('funcionalidades') }}#funcionalidades">Funcionalidades</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('download') }}#download">Download</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('campeonatos') }}">Campeonatos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('cadastro') }}">Cadastro</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="page-shell">
      {% block content %}{% endblock content %}
    </main>

    <footer>
      <p>SportCorp © 2026 · Aplicativo feito para transformar a rotina esportiva.</p>
    </footer>
  </body>
</html>
