{% extends "base.html" %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="hero-card">
          <span class="eyebrow">Cadastro</span>
          <h1 class="mb-3">Para se cadastrar, entre em contato com a escola</h1>
          <p class="lead mb-4">
            O cadastro no sistema precisa ser realizado pela escola, que é responsável

          </p>
          <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">Voltar para o início</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
